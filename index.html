<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Queens Tech Student Locator - Scanner Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f2f4f8;color:#111827}
header{background:#111827;color:white;padding:26px 20px}
header h1{margin:0;font-size:28px} header p{margin:6px 0 0;color:#cbd5e1}
main{max-width:720px;margin:auto;padding:20px}
.card{background:white;border-radius:22px;padding:20px;box-shadow:0 4px 18px #00000012;margin-bottom:18px}
button{width:100%;border:0;border-radius:16px;padding:18px;font-size:22px;font-weight:750;background:#2563eb;color:white}
#reader{margin-top:16px;overflow:hidden;border-radius:16px}
.status{font-size:18px;line-height:1.45}
.success{background:#dcfce7;border:2px solid #22c55e}
code{font-size:19px;font-weight:700}
.small{font-size:14px;color:#64748b}
</style>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
<header>
<h1>Queens Tech Student Locator</h1>
<p>Safe barcode scanner test</p>
</header>
<main>
<div class="card">
<button id="scan">📷 Scan Student ID</button>
<div id="reader"></div>
</div>
<div id="result" class="card status">
No barcode scanned yet.<br><span class="small">Test target: the small barcode that reads 240054544.</span>
</div>
</main>
<script>
const target="240054544";
let scanner=null;
const result=document.getElementById("result");

function showResult(value){
  result.classList.remove("success");
  if(value===target){
    result.classList.add("success");
    result.innerHTML="<strong>✅ SUCCESS</strong><br>Student ID barcode recognized:<br><code>"+value+"</code><br><br>The camera-to-ID portion of the app is working.";
  } else {
    result.innerHTML="<strong>Barcode read:</strong><br><code>"+value+"</code><br><br>This scanner test is expecting <code>"+target+"</code>.";
  }
}

document.getElementById("scan").addEventListener("click", async ()=>{
  if(!window.isSecureContext){
    result.innerHTML="<strong>Camera unavailable.</strong><br>This page must be opened from the HTTPS GitHub Pages address.";
    return;
  }
  try{
    if(scanner){ try{await scanner.stop();}catch(e){} }
    scanner=new Html5Qrcode("reader");
    const cameras=await Html5Qrcode.getCameras();
    if(!cameras || !cameras.length) throw new Error("No camera found");
    let cam=cameras[0].id;
    const rear=cameras.find(c=>/back|rear|environment/i.test(c.label));
    if(rear) cam=rear.id;
    await scanner.start(
      cam,
      {fps:10,qrbox:{width:300,height:140}},
      async decoded=>{
        showResult(decoded.trim());
        try{await scanner.stop();}catch(e){}
      },
      ()=>{}
    );
  }catch(e){
    result.innerHTML="<strong>Could not start camera.</strong><br>Allow camera permission for this site, then try again.<br><span class='small'>"+String(e)+"</span>";
  }
});
</script>
</body>
</html>
