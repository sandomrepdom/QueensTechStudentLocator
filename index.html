<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queens Tech Camera Diagnostic V3.6</title>
<style>body{font:18px system-ui;background:#edf1f7;margin:0;color:#142033}header{background:#142033;color:white;padding:25px}main{padding:18px;max-width:700px;margin:auto}.panel{background:white;border-radius:18px;padding:18px}button{display:block;width:100%;border:0;border-radius:12px;background:#315ce8;color:white;padding:17px;margin:12px 0;font-size:18px}button.alt{background:#64748b}video{width:100%;background:#111;border-radius:12px;min-height:220px}#status{white-space:pre-wrap;background:#edf1f7;padding:15px;border-radius:12px;overflow-wrap:anywhere}input{font-size:20px;padding:12px;max-width:90%}</style></head>
<body><header><h1>Queens Tech Student Locator</h1>Camera Diagnostic V3.6</header><main><section class="panel"><button id="start">📷 Open Rear Camera (Direct Test)</button><button class="alt" id="stop">Stop Camera</button><video id="camera" autoplay muted playsinline></video><p id="status">Ready. Tap Open Rear Camera.</p><p>First, we are testing the camera directly, without a barcode library. No student records are included in this test.</p><input id="manual" inputmode="numeric" placeholder="Test ID"><button id="check">Test Manual ID</button></section></main>
<script>
(function(){
'use strict';
var video=document.getElementById('camera'),status=document.getElementById('status'),stream=null;
function report(t){status.textContent=t;}
function stop(){if(stream){stream.getTracks().forEach(function(track){track.stop();});stream=null;}video.srcObject=null;}
document.getElementById('start').onclick=async function(){
 report('Button works. Requesting rear camera…');
 try{
  if(!window.isSecureContext)throw Error('This page is not in a secure HTTPS context.');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('Camera API is unavailable in this browser.');
  stop();
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});}
  catch(first){stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});}
  video.srcObject=stream;
  await video.play();
  report('✅ Camera opened directly. Live video is working.');
 }catch(e){report('❌ Camera error: '+(e.name||'Error')+': '+(e.message||String(e)));}
};
document.getElementById('stop').onclick=function(){stop();report('Camera stopped.');};
document.getElementById('check').onclick=function(){var v=document.getElementById('manual').value.trim();report(v==='240054544'?'✅ Test ID matched.':'Entered: '+v+' (test ID is 240054544)');};
window.addEventListener('pagehide',stop);
})();
</script></body></html>
