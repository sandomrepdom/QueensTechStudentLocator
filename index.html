<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Queens Tech Student Locator V4.9</title>
<style>
body{margin:0;background:#eef1f6;font:18px system-ui;color:#142033}
header{background:#101827;color:white;padding:10px 14px;font-size:13px}header h1{font-size:19px;margin:0 0 3px}
main{max-width:700px;margin:auto;padding:6px 10px 92px}
.card{background:white;padding:12px;border-radius:16px;margin:10px 0}
button,input{box-sizing:border-box;width:100%;padding:10px;font-size:16px;border-radius:12px;margin:4px 0}
button{background:#3262e8;color:white;border:0;font-weight:bold}
button.secondary{background:#59677b}
input{border:2px solid #aab5c5}
.camera{position:relative}
video{display:block;width:100%;height:280px;object-fit:cover;border-radius:10px;background:#111}
.line{position:absolute;top:50%;left:8%;right:8%;border-top:2px solid white;pointer-events:none}
#status{padding:9px;font-size:15px;background:#e8edf9;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#59677b}.dock{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:8px 12px max(8px,env(safe-area-inset-bottom));box-shadow:0 -3px 15px #0002;display:flex;gap:8px;z-index:10}.dock button{flex:1;margin:0;min-height:48px}.dock #stop{flex:0 0 66px}.card p{margin:7px 0}.card{margin:6px 0}
</style>
</head>
<body>
<header><h1>Queens Tech Student Locator</h1>Code 39 Auto Scanner V4.9</header>
<main>
<section class="card">
<div class="camera"><video id="video" playsinline autoplay muted></video><div class="line"></div></div>
<div id="status">Ready. This test contains no student schedules.</div>
<p><small>Keep the entire small barcode and a little white space at each end in view. Scanning starts automatically when the camera opens.</small></p>
</section>
<section class="card">
<label for="manual">Manual test ID</label>
<input id="manual" inputmode="numeric" placeholder="Enter test ID">
<button id="manualBtn">Check ID</button>
</section>
</main>
<div class="dock"><button id="start">Start camera</button><button id="capture">📸 Scan</button><button id="stop" class="secondary">Stop</button></div>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
<script>
'use strict';
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const expected='240054544';
let stream=null, running=false, busy=false, timer=null, attempts=0;
const canvas=document.createElement('canvas');
function message(m){statusEl.textContent=m;}
function decoded(value,format){
  value=String(value||'').trim();
  if(!/^\d{9}$/.test(value)){
    if(running){
      message('Ignoring '+value.length+'-character barcode. Keep aiming at the small barcode.');
      schedule(350);
    }else{
      message('This is not a nine-digit student ID.');
    }
    return;
  }
  running=false;
  clearTimeout(timer);
  message((value===expected?'SUCCESS: ':'Nine-digit barcode: ')+value+
    '\nFormat: '+format+
    (value===expected?'\nTest ID matched.':'\nDifferent test ID.'));
  if(value===expected && navigator.vibrate)navigator.vibrate(150);
}

function stop(){
  running=false;
  clearTimeout(timer);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
}
async function start(){
  stop();
  attempts=0;
  if(!window.Quagga){message('Quagga2 did not load. Check internet access.');return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
    });
    video.srcObject=stream;
    await video.play();
    running=true;
    message('Rear camera active. Automatically scanning Code 39…');
    schedule(120);
  }catch(e){message('Camera error: '+e.name+' '+e.message);}
}
function schedule(ms){clearTimeout(timer);if(running)timer=setTimeout(()=>scan(false),ms);}
// Scan the upper ID barcode first. Process one crop per cycle to avoid
// serial full-frame decoding delaying the next camera frame.
function scan(manual){
  if(busy)return;
  if(!stream||!video.videoWidth){message('Start camera first.');return;}
  if(!window.Quagga){message('Quagga2 library unavailable.');return;}
  busy=true;
  attempts++;
  if(manual)message('Scanning small barcode…');
  const w=video.videoWidth,h=video.videoHeight;
  // The upper half is the successful V4.8 region. Every third attempt
  // shifts downward slightly; a full frame is a rare fallback.
  const region=attempts%9===0 ? [0,0,1,1] :
               attempts%3===0 ? [0,0.12,1,0.42] : [0,0,1,0.55];
  const [rx,ry,rw,rh]=region;
  const sx=Math.round(rx*w),sy=Math.round(ry*h);
  const sw=Math.round(rw*w),sh=Math.round(rh*h);
  // 1280px instead of 2000px: fewer pixels per decode.
  canvas.width=1280;
  canvas.height=Math.round(1280*sh/sw);
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  const data=canvas.toDataURL('image/jpeg',0.88);
  let settled=false;
  const watchdog=setTimeout(()=>finish(null),2500);
  function finish(value){
    if(settled)return;
    settled=true;clearTimeout(watchdog);busy=false;
    if(value){decoded(value,'code_39');return;}
    if(manual)message('No nine-digit barcode detected. Keep aiming at the small barcode.');
    if(running)schedule(90);
  }
  try{
    Quagga.decodeSingle({
      src:data,numOfWorkers:0,locate:true,
      inputStream:{size:1280},
      decoder:{readers:['code_39_reader']},
      locator:{halfSample:false,patchSize:'medium'}
    },result=>{
      const value=String(result?.codeResult?.code||'').trim();
      finish(/^\d{9}$/.test(value)?value:null);
    });
  }catch(e){finish(null);}
}
document.getElementById('start').addEventListener('click',start);
document.getElementById('capture').addEventListener('click',()=>scan(true));
document.getElementById('stop').addEventListener('click',()=>{stop();message('Camera stopped.');});
document.getElementById('manualBtn').addEventListener('click',()=>{
  const id=document.getElementById('manual').value.trim();
  if(id)decoded(id,'manual');
});
window.addEventListener('pagehide',stop);
</script>
</body>
</html>
