<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Queens Tech Student Locator - Scanner Test V3.4</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#eef1f6}
body{margin:0}.hero{background:#101827;color:white;padding:30px 22px}.hero h1{font-size:32px;margin:0 0 10px}.hero p{font-size:19px;color:#cbd5e1;margin:0}
main{padding:20px;max-width:760px;margin:auto}.card{background:white;border-radius:24px;padding:20px;margin-bottom:18px}
button{width:100%;border:0;border-radius:18px;padding:18px;font-size:21px;font-weight:800;margin-bottom:12px;background:#3563e9;color:white}
button.secondary{background:#536176}
.scanner{position:relative;background:#111;border-radius:18px;overflow:hidden;min-height:220px}
#reader{display:block;width:100%;min-height:220px;object-fit:cover}
.scanline{position:absolute;left:6%;right:6%;top:50%;height:3px;background:#fff;box-shadow:0 0 8px #fff;pointer-events:none}
.guide{position:absolute;left:5%;right:5%;top:36%;height:28%;border:2px solid #fff;border-radius:10px;pointer-events:none}
#status{font-size:18px;font-weight:700;line-height:1.4;padding:14px;border-radius:14px;background:#f1f5f9;margin-top:12px}
.small{font-size:15px;color:#64748b;line-height:1.45}.success{background:#dcfce7!important;color:#166534}.bad{background:#fee2e2!important;color:#991b1b}
input{box-sizing:border-box;width:100%;font-size:21px;padding:17px;border:3px solid #cbd5e1;border-radius:17px;margin:10px 0 12px}
</style>
</head>
<body>
<header class="hero"><h1>Queens Tech Student Locator</h1><p>1-D Student ID Scanner Test V3.4</p></header>
<main>
<section class="card">
<button id="start">📷 Start V3.4 Barcode Scanner</button>
<button id="stop" class="secondary">Stop Camera</button>
<div class="scanner"><video id="reader" playsinline muted></video><div class="guide"></div><div class="scanline"></div></div>
<div id="status">Ready. V3.4 will test the major 1-D barcode formats.</div>
<p class="small">Hold the small barcode horizontally so its vertical bars cross the white center line. Keep the entire barcode and white margins visible.</p>
</section>
<section class="card">
<h2>Manual fallback test</h2>
<input id="manual" inputmode="numeric" placeholder="Enter Student ID">
<button id="check">Check Student ID</button>
</section>
</main>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const TARGET="240054544";
const statusEl=document.getElementById("status");
let reader=null, controls=null, last="";

function showResult(value, source){
  value=String(value||"").trim();
  if(!value || value===last) return;
  last=value;
  if(value===TARGET){
    statusEl.className="success";
    statusEl.innerHTML="✅ SUCCESS<br>Student ID: <b>"+value+"</b><br>Read by: "+source;
    if(navigator.vibrate) navigator.vibrate(150);
    stopScanner();
  } else {
    statusEl.className="bad";
    statusEl.innerHTML="Barcode detected: <b>"+value+"</b><br>Detected by: "+source+"<br>Decoder is working, but this is not the test Student ID.";
    setTimeout(()=>{last="";},1000);
  }
}

async function startScanner(){
  stopScanner();
  statusEl.className="";
  statusEl.textContent="Starting rear camera…";
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.CODE_93,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.CODABAR,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E
    ]);
    reader=new ZXing.BrowserMultiFormatReader(hints,100);
    controls=await reader.decodeFromConstraints(
      {video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}},
      "reader",
      (res,err)=>{
        if(res) showResult(res.getText(),"ZXing V3.4" + (res.getBarcodeFormat ? " / format "+res.getBarcodeFormat() : "")");
      }
    );
    statusEl.textContent="Camera active. Place the barcode across the white center line.";
  }catch(e){
    statusEl.className="bad";
    statusEl.textContent="Could not start scanner: "+(e.message||e);
  }
}
function stopScanner(){
  try{if(controls&&controls.stop)controls.stop();}catch(e){}
  try{if(reader)reader.reset();}catch(e){}
  controls=null; reader=null;
}
document.getElementById("start").onclick=startScanner;
document.getElementById("stop").onclick=()=>{stopScanner();statusEl.className="";statusEl.textContent="Camera stopped.";};
document.getElementById("check").onclick=()=>showResult(document.getElementById("manual").value,"manual entry");
</script>
</body>
</html>
